<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz Fiscal Interactiva</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>

    <!-- Tailwind (for easy styling) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }

        .kpi-label {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .badge:hover {
            transform: translateY(-1px);
        }

        .badge-remove {
            margin-left: 6px;
            opacity: 0.7;
        }

        .badge-remove:hover {
            opacity: 1;
        }

        /* Table Styles */
        .fiscal-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .fiscal-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
            font-weight: 600;
        }

        .fiscal-table td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        .fiscal-table tr:hover {
            background-color: #f8fafc;
        }

        .amount-cell {
            font-family: 'Monaco', 'Consolas', monospace;
            text-align: right;
        }

        .positive {
            color: #16a34a;
        }

        .negative {
            color: #dc2626;
        }

        .neutral {
            color: #64748b;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LineChart, Line, PieChart, Pie, Cell } = Recharts;

        // --- ARTIFACT DATA INJECTION POINT ---
        // Will be replaced by Python
        const DATA_SOURCE = window.ARTIFACT_DATA || {
            data: [], filters: {}, mes_anterior: "2025-11", mes_actual: "2025-12"
        };

        const formatCurrency = (val) => {
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);
        };

        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#82ca9d'];

        const App = () => {
            const [data, setData] = useState(DATA_SOURCE.data);
            const [filters, setFilters] = useState(DATA_SOURCE.filters);

            // Re-sync if window data changes (for Streamlit reloading)
            useEffect(() => {
                if (window.ARTIFACT_DATA) {
                    setData(window.ARTIFACT_DATA.data);
                    setFilters(window.ARTIFACT_DATA.filters);
                }
            }, []);

            // --- FILTERING LOGIC ---
            const filteredData = useMemo(() => {
                if (!data) return [];

                return data.filter(row => {
                    // 1. Segmento Fiscal
                    if (filters.segmento_fiscal !== "Todos los Segmentos") {
                        const seg = filters.segmento_fiscal;
                        const match =
                            (seg === "Ingreso" && row.tipo === "I") ||
                            (seg === "Egreso" && row.tipo === "E") ||
                            (seg === "Nómina" && row.tipo === "N") ||
                            (seg === "Pago" && row.tipo === "P") ||
                            (seg === "Traslado" && row.tipo === "T") ||
                            (seg === "PPD" && row.segmento === "PPD") ||
                            (seg === "PUE" && row.segmento === "PUE");
                        if (!match) return false;
                    }

                    // 2. Flujo de Caja
                    if (filters.flujo_caja === "EMITIDOS") {
                        if (row.rfc_emisor !== DATA_SOURCE.rfc_empresa) return false;
                    } else if (filters.flujo_caja === "RECIBIDOS") {
                        if (row.rfc_receptor !== DATA_SOURCE.rfc_empresa) return false;
                    }

                    // 3. Rango de Saldo (Simplificado a monto del registro por ahora)
                    // if (row.monto < filters.saldo_min || row.monto > filters.saldo_max) return false;

                    // 4. Métodos de Pago
                    if (filters.metodos_pago && filters.metodos_pago.length > 0) {
                        if (!filters.metodos_pago.includes(row.metodo_pago)) return false;
                    }

                    // 5. Uso CFDI
                    if (filters.usos_cfdi && filters.usos_cfdi.length > 0) {
                        if (!filters.usos_cfdi.includes(row.uso_cfdi)) return false;
                    }

                    // 6. Busqueda
                    if (filters.buscar_concepto) {
                        const term = filters.buscar_concepto.toLowerCase();
                        if (!row.concepto.toLowerCase().includes(term)) return false;
                    }

                    // 7. Año/Mes (Si vienen pre-filtrados desde Mongo, esto es redundante pero seguro)
                    // La app.py ya filtra la carga inicial por año, pero el mes puede ser 0 (todos)
                    if (filters.mes_operacion && filters.mes_operacion !== 0) {
                        const rowMonth = parseInt(row.periodo.split('-')[1]);
                        if (rowMonth !== filters.mes_operacion) return false;
                    }

                    return true;
                });
            }, [data, filters]);

            // --- KPI CALCULATIONS ---
            const kpis = useMemo(() => {
                const total = filteredData.reduce((sum, r) => sum + (r.monto || 0), 0);
                const count = filteredData.length;

                // Comparativa PUE vs PPD
                const totalPue = filteredData.filter(r => r.metodo_pago === 'PUE').reduce((s, r) => s + r.monto, 0);
                const totalPpd = filteredData.filter(r => r.metodo_pago === 'PPD').reduce((s, r) => s + r.monto, 0);

                return { total, count, totalPue, totalPpd };
            }, [filteredData]);

            // --- CHART DATA ---
            const chartData = useMemo(() => {
                // Group by Period
                const groups = {};
                filteredData.forEach(r => {
                    if (!groups[r.periodo]) groups[r.periodo] = { name: r.periodo, PUE: 0, PPD: 0, Total: 0 };
                    groups[r.periodo].Total += r.monto;
                    if (r.metodo_pago === 'PUE') groups[r.metodo_pago] += r.monto;
                    if (r.metodo_pago === 'PPD') groups[r.metodo_pago] += r.monto;
                });
                return Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));
            }, [filteredData]);

            // --- TABLE DATA ---
            const tableData = useMemo(() => {
                // Agrupar por Concepto y Periodo
                const grouped = {};
                filteredData.forEach(r => {
                    if (!grouped[r.concepto]) {
                        grouped[r.concepto] = {
                            concepto: r.concepto,
                            segmento: r.segmento,
                            anterior: 0,
                            actual: 0,
                            total: 0
                        };
                    }

                    if (r.periodo === DATA_SOURCE.mes_anterior) grouped[r.concepto].anterior += r.monto;
                    if (r.periodo === DATA_SOURCE.mes_actual) grouped[r.concepto].actual += r.monto;
                    grouped[r.concepto].total += r.monto;
                });
                return Object.values(grouped).sort((a, b) => b.total - a.total);
            }, [filteredData, DATA_SOURCE.mes_anterior, DATA_SOURCE.mes_actual]);

            // --- FORMATTING HELPERS ---
            const activeFiltersList = useMemo(() => {
                const list = [];
                if (filters.segmento_fiscal !== "Todos los Segmentos") list.push({ k: 'seg', label: filters.segmento_fiscal });
                if (filters.flujo_caja !== "TODO") list.push({ k: 'flujo', label: filters.flujo_caja });
                if (filters.mes_operacion !== 0) list.push({ k: 'mes', label: `Mes ${filters.mes_operacion}` });
                if (filters.buscar_concepto) list.push({ k: 'search', label: `🔍 "${filters.buscar_concepto}"` });
                return list;
            }, [filters]);

            return (
                <div className="p-4">
                    {/* Header Filters Badge */}
                    <div className="flex flex-wrap gap-2 mb-6 items-center">
                        <span className="text-gray-500 font-medium text-sm">Filtros Activos:</span>
                        {activeFiltersList.length === 0 && <span className="text-xs text-gray-400 italic">Ninguno</span>}
                        {activeFiltersList.map((f, i) => (
                            <span key={i} className="badge bg-blue-100 text-blue-800 border border-blue-200">
                                {f.label}
                            </span>
                        ))}
                    </div>

                    {/* KPIs */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="card border-l-4 border-blue-500">
                            <div className="kpi-label">Total Filtrado</div>
                            <div className="kpi-value text-blue-600">{formatCurrency(kpis.total)}</div>
                        </div>
                        <div className="card border-l-4 border-green-500">
                            <div className="kpi-label">Pagado en Una Exhibición (PUE)</div>
                            <div className="kpi-value text-green-600">{formatCurrency(kpis.totalPue)}</div>
                        </div>
                        <div className="card border-l-4 border-orange-500">
                            <div className="kpi-label">Pago en Parcialidades (PPD)</div>
                            <div className="kpi-value text-orange-600">{formatCurrency(kpis.totalPpd)}</div>
                        </div>
                        <div className="card border-l-4 border-purple-500">
                            <div className="kpi-label">Registros</div>
                            <div className="kpi-value text-purple-600">{kpis.count}</div>
                        </div>
                    </div>

                    {/* Charts */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        <div className="card h-80">
                            <h3 className="font-bold text-gray-700 mb-4">Tendencia Mensual</h3>
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={chartData}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                    <XAxis dataKey="name" axisLine={false} tickLine={false} />
                                    <YAxis hide />
                                    <Tooltip formatter={(val) => formatCurrency(val)} />
                                    <Bar dataKey="Total" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                        <div className="card h-80 overflow-auto">
                            <h3 className="font-bold text-gray-700 mb-4">Matriz Detallada</h3>
                            <table className="fiscal-table">
                                <thead>
                                    <tr>
                                        <th>Concepto</th>
                                        <th className="text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {tableData.slice(0, 10).map((row, idx) => (
                                        <tr key={idx}>
                                            <td>
                                                <div className="font-medium">{row.concepto}</div>
                                                <div className="text-xs text-gray-400">{row.segmento}</div>
                                            </td>
                                            <td className="amount-cell">{formatCurrency(row.total)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {tableData.length > 10 && (
                                <div className="text-center text-xs text-gray-500 mt-2">
                                    + {tableData.length - 10} registros más...
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
