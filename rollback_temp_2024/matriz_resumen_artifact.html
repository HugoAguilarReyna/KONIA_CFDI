<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Fiscal Premium</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/classnames/2.3.2/index.min.js"></script>

    <!-- Recharts (CDNJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Date-fns (Fixed CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.30.0/dist/date-fns.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --secondary-glow: rgba(168, 85, 247, 0.4);
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- DECORATIVE BACKGROUND --- */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #f8fafc;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--secondary-glow) 100%);
            filter: blur(80px);
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            top: -200px;
            right: -100px;
        }

        .blob-2 {
            bottom: -200px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes move {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(50px, 50px) scale(1.1);
            }
        }

        /* --- GLASSMORPHISM --- */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px 0 rgba(31, 38, 135, 0.12);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
        }

        .glass-input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        /* --- PREMIUM ELEMENTS --- */
        .premium-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.2s;
        }

        .premium-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .premium-btn:active {
            transform: scale(0.98);
        }

        .filter-chip {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .filter-chip.inactive {
            background: rgba(241, 245, 249, 0.8);
            color: #64748b;
        }

        /* --- TABLES --- */
        .fiscal-table-container {
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .fiscal-table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        .fiscal-table th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 10px;
            padding: 18px;
            text-align: left;
            letter-spacing: 0.1em;
        }

        .fiscal-table td {
            padding: 16px 18px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13.5px;
        }

        /* --- ANIMATIONS --- */
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <script>
        // Global error capture
        window.onerror = function (msg, url, line) {
            console.error("Critical Error:", msg, "at", url, ":", line);
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `<div style="padding: 40px; text-align: center; font-family: sans-serif;">
                    <h2 style="color: #ef4444;">⚠️ Error de Carga</h2>
                    <p style="color: #64748b;">${msg}</p>
                    <p style="font-size: 0.8rem; color: #94a3b8;">Línea: ${line}</p>
                    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; border-radius: 8px; background: #6366f1; color: white; border: none; cursor: pointer;">
                        Reintentar
                    </button>
                </div>`;
            }
        };
    </script>
</head>

<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;
        const {
            BarChart, Bar, LineChart, Line, PieChart, Pie, Cell,
            XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
            AreaChart, Area
        } = window.Recharts || {};

        // --- MOCK DATA ---
        const MOCK_DATA = {
            data: [],
            label: "Sin Datos"
        };

        // --- ICON WRAPPER ---
        const Icon = ({ name, className }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="glass-card m-10 text-center">
                            <h2 className="text-xl font-black text-rose-500 mb-2">Error en el Dashboard</h2>
                            <p className="text-slate-500 mb-4">{this.state.error?.message}</p>
                            <button onClick={() => window.location.reload()} className="premium-btn mx-auto">Recargar</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }



        // --- FORMATTERS ---
        const formatCurrency = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);

        const MatrixApp = () => {
            const [rawPayload] = useState(() => {
                console.log("Initializing App Data...", window.data);
                return window.data || MOCK_DATA;
            });

            // 1. Filtered Data (already filtered by backend, but we treat it as the master dataset)
            const masterData = useMemo(() => rawPayload.data || [], [rawPayload]);

            // 2. Identification of Periods
            const periods = useMemo(() => {
                // Extract unique YYYY-MM from available data
                const unique = [...new Set(masterData.map(d => String(d.fecha).substring(0, 7)))].sort();
                return unique;
            }, [masterData]);

            const currentPeriod = periods[periods.length - 1] || "N/A";
            const prevPeriod = periods[periods.length - 2] || "N/A";

            // 3. Process Data for Charts (Trends over time)
            const trendData = useMemo(() => {
                const groups = {};
                masterData.forEach(item => {
                    const key = String(item.fecha).substring(0, 7); // Group by Month
                    if (!groups[key]) groups[key] = { name: key, PPD: 0, PUE: 0, NC: 0, Pagos: 0, Total: 0, Anticipos: 0, Facturado: 0 };

                    const val = Number(item.monto) || 0;
                    const c = String(item.concepto).trim();

                    // Facturacion Logic
                    if (c.includes('Total Facturado') || c.includes('Debito')) {
                        groups[key].Facturado += val;
                    }

                    // PPD vs PUE Logic for bars
                    if (item.segmento === 'PPD' && c.includes('Total Facturado')) groups[key].PPD += val;
                    if (item.segmento === 'PUE' && c.includes('Total Facturado')) groups[key].PUE += val;

                    // Movements
                    if (c.includes('Notas de Crédito') || c.includes('Notas de Credito')) groups[key].NC += Math.abs(val);
                    if (c.includes('Pagos Aplicados')) groups[key].Pagos += Math.abs(val);
                    if (c.includes('Anticipo')) groups[key].Anticipos += Math.abs(val);

                    // Net Warning: This needs to be carefully aligned with table logic
                    // For the area chart (Saldo Evolution), we want the 'Unpaid Balance' per month? 
                    // Or just the net flow? 
                    // Usually "Saldo Insoluto" is cumulative, but here we likely show the *monthly* result or snapshot.
                    // Given the backend sends movements, we can sum them up.
                });

                return Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));
            }, [masterData]);

            // 4. KPIs Calculation (Focused on Current Period mainly)
            const kpis = useMemo(() => {
                const calculateForPeriod = (pLabel) => {
                    const subset = masterData.filter(d => String(d.fecha).startsWith(pLabel));

                    let facturado = 0, ppd_insoluto = 0, pue_insoluto = 0, nc = 0, anticipos = 0, pagos = 0, devoluciones = 0, nd = 0;

                    subset.forEach(i => {
                        const val = Number(i.monto) || 0;
                        const c = String(i.concepto).trim();
                        const seg = i.segmento;

                        if (c.includes('Total Facturado')) facturado += val;
                        if (c.includes('Notas de Crédito') || c.includes('Notas de Credito')) nc += Math.abs(val);
                        if (c.includes('Nota de Débito') || c.includes('Nota de Debito')) nd += val;
                        if (c.includes('Devoluciones')) devoluciones += Math.abs(val);
                        if (c.includes('Sustituciones')) devoluciones += Math.abs(val); // Grouped
                        if (c.includes('Anticipo')) anticipos += Math.abs(val);
                        if (c.includes('Pagos Aplicados')) pagos += Math.abs(val);

                        // Insoluto Logic
                        let sign = 1;
                        if (c.includes('(-)')) sign = -1;

                        // Precise logic for insolvency
                        const amount = Math.abs(val) * sign;
                        if (seg === 'PPD') ppd_insoluto += amount;
                        if (seg === 'PUE') pue_insoluto += amount;
                    });

                    return {
                        facturado,
                        ppd_insoluto,
                        pue_insoluto,
                        saldo_total_real: ppd_insoluto + pue_insoluto, // Real tech sum
                        saldo_cliente: ppd_insoluto, // KPI Definition: Only PPD counts as 'Saldo a Favor' usually if negative
                        nc,
                        nd,
                        anticipos,
                        pagos,
                        devoluciones
                    };
                };

                const current = calculateForPeriod(currentPeriod);
                const prev = calculateForPeriod(prevPeriod);

                // Helper for variation
                const getVar = (curr, old) => {
                    if (!old || old === 0) return 0;
                    return ((curr - old) / old) * 100;
                };

                return {
                    current,
                    variations: {
                        facturado: getVar(current.facturado, prev.facturado),
                        saldo: getVar(current.saldo_cliente, prev.saldo_cliente),
                        pagos: getVar(current.pagos, prev.pagos),
                        anticipos: getVar(current.anticipos, prev.anticipos),
                        nc: getVar(current.nc, prev.nc)
                    }
                };
            }, [masterData, currentPeriod, prevPeriod]);

            const currentKpis = kpis.current;

            return (
                <div className="max-w-[1600px] mx-auto pb-20">
                    <header className="mb-8 flex items-center justify-between fade-in px-4 md:px-0">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                                <Icon name="activity" className="w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight leading-none">Matriz Fiscal <span className="text-indigo-600">Premium</span></h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Periodo: {currentPeriod}</span>
                                    <span className="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-bold rounded-full">En Vivo</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT Area */}
                    <div className="w-full space-y-6 fade-in">

                        {/* KPIS ROW 1: CRITICAL FINANCIALS */}
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                            <StatItem
                                label="Saldo a Favor (Clientes)"
                                subLabel="Saldo Insoluto PPD"
                                value={currentKpis.saldo_cliente}
                                variation={kpis.variations.saldo}
                                icon="wallet"
                                color={currentKpis.saldo_cliente < 0 ? "emerald" : "indigo"} // Negative is good (Client owes less? Or we owe client?) 
                            // User said: "Cifras negativas indican saldo a favor de clientes". So Negative = Good for them, Bad for us? 
                            // Actually "Saldo a Favor Clientes" usually means We owe them money (Credit Balance).
                            // Detailed request: "Cambiar el KPI a -22M ... reflejar que es un pasivo".
                            />
                            <StatItem
                                label="Total Pagos Aplicados"
                                value={currentKpis.pagos}
                                variation={kpis.variations.pagos}
                                icon="check-circle"
                                color="emerald"
                            />
                            <StatItem
                                label="Total Anticipos"
                                value={currentKpis.anticipos}
                                variation={kpis.variations.anticipos}
                                icon="piggy-bank"
                                color="amber"
                            />
                            <StatItem
                                label="Total Facturado"
                                value={currentKpis.facturado}
                                variation={kpis.variations.facturado}
                                icon="file-text"
                                color="blue"
                            />
                        </div>

                        {/* KPIS ROW 2: DETALLE OPERATIVO */}
                        <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                            <StatItem label="Notas de Crédito" value={currentKpis.nc} variation={kpis.variations.nc} icon="file-minus" color="rose" size="sm" />
                            <StatItem label="Notas de Débito" value={currentKpis.nd} icon="file-plus" color="orange" size="sm" />
                            <StatItem label="Devoluciones" value={currentKpis.devoluciones} icon="refresh-ccw" color="purple" size="sm" />
                            <StatItem label="Insoluto PUE" value={currentKpis.pue_insoluto} icon="alert-circle" color="slate" size="sm" />
                            <StatItem label="Insoluto PPD" value={currentKpis.ppd_insoluto} icon="clock" color="slate" size="sm" />
                        </div>

                        {/* CHARTS ROW */}
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                            {/* CHART 1: Facturación Trend */}
                            <div className="glass-card">
                                <h3 className="text-xs font-black uppercase text-slate-400 mb-6 tracking-widest flex items-center gap-2">
                                    <div className="w-1.5 h-4 bg-indigo-500 rounded-full"></div> Tendencia de Facturación (Últimos 12 Meses)
                                </h3>
                                <div className="h-[320px] w-full">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={trendData} margin={{ top: 20, right: 30, left: 0, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="name" fontSize={10} fontWeight={700} axisLine={false} tickLine={false} dy={10} tick={{ fill: '#94a3b8' }} />
                                            <YAxis fontSize={9} fontWeight={700} axisLine={false} tickLine={false} tickFormatter={v => `$${v / 1000000}M`} tick={{ fill: '#94a3b8' }} />
                                            <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(99,102,241,0.05)' }} />
                                            <Legend verticalAlign="top" align="right" height={36} iconType="circle" wrapperStyle={{ fontSize: '10px' }} />
                                            <Bar dataKey="PPD" name="Facturado PPD" stackId="a" fill="#f59e0b" radius={[0, 0, 0, 0]} barSize={40} />
                                            <Bar dataKey="PUE" name="Facturado PUE" stackId="a" fill="#10b981" radius={[4, 4, 0, 0]} barSize={40}>
                                                {/* Label on top of stack? Hard in Recharts without custom component */}
                                            </Bar>
                                            <Line type="monotone" dataKey="Facturado" name="Tendencia" stroke="#6366f1" strokeWidth={3} dot={{ r: 4, strokeWidth: 2 }} activeDot={{ r: 6 }} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* CHART 2: Movimientos Breakdown */}
                            <div className="glass-card">
                                <h3 className="text-xs font-black uppercase text-slate-400 mb-6 tracking-widest flex items-center gap-2">
                                    <div className="w-1.5 h-4 bg-rose-500 rounded-full"></div> Movimientos del Período ({currentPeriod})
                                </h3>
                                <div className="h-[320px] w-full flex items-center justify-center">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={[
                                            { name: 'Facturado', valor: currentKpis.facturado, fill: '#6366f1' },
                                            { name: 'Pagos', valor: currentKpis.pagos, fill: '#10b981' },
                                            { name: 'Notas Cred.', valor: currentKpis.nc, fill: '#f43f5e' },
                                            { name: 'Anticipos', valor: currentKpis.anticipos, fill: '#f59e0b' }
                                        ]} layout="vertical" margin={{ top: 0, right: 30, left: 40, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} stroke="#f1f5f9" />
                                            <XAxis type="number" hide />
                                            <YAxis dataKey="name" type="category" fontSize={10} fontWeight={700} axisLine={false} tickLine={false} tick={{ fill: '#64748b' }} width={80} />
                                            <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(0,0,0,0.02)' }} />
                                            <Bar dataKey="valor" radius={[0, 4, 4, 0]} barSize={30}>
                                                {/* Label List for values */}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* FINANCIAL MATRIX TABLE - Historical View */}
                        <div className="glass-card fade-in">
                            <div className="flex items-center justify-between mb-6">
                                <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest flex items-center gap-2">
                                    <div className="w-1.5 h-4 bg-slate-800 rounded-full"></div> Matriz Fiscal Detallada ({periods[0]} - {currentPeriod})
                                </h3>
                            </div>

                            <div className="fiscal-table-container max-h-[800px] overflow-auto custom-scrollbar shadow-xl rounded-xl border border-slate-200">
                                <table className="w-full text-xs box-border">
                                    <thead className="sticky top-0 z-20 shadow-md">
                                        <tr className="bg-[#1e293b] text-white">
                                            <th className="px-4 py-3 text-left font-bold uppercase tracking-wider w-24">SEGMENTO</th>
                                            <th className="px-4 py-3 text-left font-bold uppercase tracking-wider">CONCEPTO FISCAL</th>
                                            {periods.map(p => (
                                                <th key={p} className="px-4 py-3 text-right font-bold uppercase tracking-wider bg-[#334155] whitespace-nowrap">{p}</th>
                                            ))}
                                            <th className="px-4 py-3 text-right font-black uppercase tracking-wider bg-[#0f172a]">TOTAL</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                        {['PPD', 'PUE'].map(segmento => {
                                            const isPPD = segmento === 'PPD';
                                            const bgSegment = isPPD ? 'bg-[#fff7ed]' : 'bg-[#ecfdf5]';
                                            const badgeClass = isPPD ? 'bg-orange-100 text-orange-700' : 'bg-emerald-100 text-emerald-700';

                                            // Define Concepts
                                            const conceptsOrder = [
                                                '1. (+) Total Facturado',
                                                '2. (-) Notas de Crédito (01)',
                                                '3. (+) Nota de Débito (02)',
                                                '4. (-) Devoluciones (03)',
                                                '5. (-) Sustituciones (04)',
                                                '6. Traslado de mercancía (05,06)',
                                                '7. (-) Anticipo (07)',
                                                '8. (-) Pagos Aplicados (08/09)',
                                            ];

                                            const segmentRows = conceptsOrder.map(conceptLabel => {
                                                let keywords = [];
                                                if (conceptLabel.includes('Total Facturado')) keywords = ['Total Facturado'];
                                                else if (conceptLabel.includes('Notas de Crédito')) keywords = ['Notas de Crédito', 'Notas de Credito', '01'];
                                                else if (conceptLabel.includes('Nota de Débito')) keywords = ['Nota de Débito', 'Nota de Debito', '02'];
                                                else if (conceptLabel.includes('Devoluciones')) keywords = ['Devoluciones', '03'];
                                                else if (conceptLabel.includes('Sustituciones')) keywords = ['Sustituciones', '04'];
                                                else if (conceptLabel.includes('Traslado')) keywords = ['Traslado', '05', '06'];
                                                else if (conceptLabel.includes('Anticipo')) keywords = ['Anticipo', '07'];
                                                else if (conceptLabel.includes('Pagos Aplicados')) keywords = ['Pagos Aplicados', '08', '09'];

                                                const rowValues = periods.map(pLabel => {
                                                    const subset = masterData.filter(d =>
                                                        String(d.fecha).startsWith(pLabel) &&
                                                        d.segmento === segmento &&
                                                        keywords.some(k => String(d.concepto).includes(k))
                                                    );
                                                    const val = subset.reduce((acc, curr) => acc + (Number(curr.monto) || 0), 0);
                                                    let signedVal = val;
                                                    if (conceptLabel.includes('(-)')) signedVal = -Math.abs(val);
                                                    return signedVal;
                                                });

                                                const rowTotal = rowValues.reduce((a, b) => a + b, 0);

                                                return { label: conceptLabel, values: rowValues, total: rowTotal, isSaldo: false };
                                            });

                                            // Calculate Insoluto Values per period (Row 9)
                                            const insolutoValues = periods.map((_, colIdx) => {
                                                let colSum = 0;
                                                segmentRows.forEach(r => colSum += r.values[colIdx]);
                                                return colSum;
                                            });
                                            const insolutoTotal = insolutoValues.reduce((a, b) => a + b, 0);

                                            segmentRows.push({
                                                label: isPPD ? '9. (=) Saldo Insoluto PPD' : '9. (=) Saldo Teórico PUE',
                                                values: insolutoValues,
                                                total: insolutoTotal,
                                                isSaldo: true
                                            });

                                            return segmentRows.map((row, rIdx) => (
                                                <tr key={`${segmento}-${rIdx}`} className={`border-b border-slate-100 hover:brightness-95 transition-all ${bgSegment}`}>
                                                    <td className="px-4 py-2 border-r border-slate-200/50">
                                                        {(rIdx === 0 || rIdx === segmentRows.length - 1) && <span className={`px-2 py-0.5 rounded text-[10px] font-black ${badgeClass}`}>{segmento}</span>}
                                                    </td>
                                                    <td className={`px-4 py-2 text-slate-700 font-medium ${row.isSaldo ? 'font-black' : ''}`}>{row.label}</td>
                                                    {row.values.map((v, idx) => (
                                                        <td key={idx} className={`px-4 py-2 text-right font-mono font-bold whitespace-nowrap ${v < 0 ? 'text-rose-500' : (v > 0 ? 'text-slate-600' : 'text-slate-300')} ${row.isSaldo ? 'text-slate-800' : ''}`}>
                                                            {formatCurrency(v)}
                                                        </td>
                                                    ))}
                                                    <td className="px-4 py-2 text-right font-mono font-black text-slate-800 bg-slate-50">{formatCurrency(row.total)}</td>
                                                </tr>
                                            ));
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const StatItem = ({ label, subLabel, value, variation, icon, color, size }) => {
            const colors = {
                indigo: 'bg-indigo-50 text-indigo-600',
                emerald: 'bg-emerald-50 text-emerald-600',
                amber: 'bg-amber-50 text-amber-600',
                rose: 'bg-rose-50 text-rose-600',
                blue: 'bg-blue-50 text-blue-600',
                orange: 'bg-orange-50 text-orange-600',
                purple: 'bg-purple-50 text-purple-600',
                slate: 'bg-slate-100 text-slate-600'
            };

            const isSmall = size === 'sm';

            return (
                <div className={`glass-card flex items-center justify-between group ${isSmall ? 'p-4' : 'p-6'}`}>
                    <div>
                        <p className="text-[10px] uppercase font-black text-slate-400 tracking-widest mb-1">{label}</p>
                        {subLabel && <p className="text-[9px] text-slate-400 font-medium -mt-1 mb-1">{subLabel}</p>}
                        <div className="flex items-baseline gap-2">
                            <h2 className={`${isSmall ? 'text-lg' : 'text-2xl'} font-black text-slate-800 tracking-tighter`}>
                                {typeof value === 'number' ? formatCurrency(value) : value}
                            </h2>
                            {variation !== undefined && variation !== 0 && (
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md ${variation > 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                    {variation > 0 ? '+' : ''}{variation.toFixed(1)}%
                                </span>
                            )}
                        </div>
                    </div>
                    <div className={`${isSmall ? 'w-8 h-8' : 'w-10 h-10'} rounded-xl flex items-center justify-center ${colors[color] || colors.indigo}`}>
                        <Icon name={icon} className={isSmall ? "w-4 h-4" : "w-5 h-5"} />
                    </div>
                </div>
            );
        };

        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="glass-card !p-5 !rounded-3xl !bg-white/95 shadow-2xl border-indigo-100 min-w-[240px]">
                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 border-b border-slate-100 pb-3">{label}</p>
                        <div className="flex flex-col gap-3">
                            {payload.map((p, i) => (
                                <div key={i} className="flex justify-between items-center gap-6">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full" style={{ backgroundColor: p.color }}></div>
                                        <span className="text-[10px] font-bold text-slate-500 uppercase">{p.name}</span>
                                    </div>
                                    <span className="text-sm font-black text-slate-800">{formatCurrency(p.value)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><MatrixApp /></ErrorBoundary>);
    </script>
</body>

</html>
